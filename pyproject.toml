[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-arxiv"
version = "0.1.0"
description = "arXiv Scraping, Hierarchical Parsing, and Reference Matching Pipeline for Introduction to Data Science (FIT-HCMUS)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Phạm Minh Thông", email = "thongpham796@gmail.com" },
    { name = "Nguyễn Tiến Thành", email = "23120358@student.hcmus.edu.vn" },
    { name = "Nguyễn Trịnh Quang", email = "23120345@student.hcmus.edu.vn" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "arxiv>=2.1.0",
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.5.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
    "pylatexenc>=2.10",
    "bibtexparser>=1.4.0",
    "rapidfuzz>=3.5.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
ids-arxiv = "ids_arxiv.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
